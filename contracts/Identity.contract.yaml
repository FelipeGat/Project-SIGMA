# Sigma Contract — Identity
# Contrato do conceito de domínio "Identity" (ver IDENTITY_MODEL.md e
# IDENTITY_LIFECYCLE.md) — só o contrato, nenhum código ainda. Nasce
# antes da implementação da Release 3, por decisão do Product Owner,
# no mesmo espírito de contracts/Module.contract.yaml na Release 2.

name: Identity
version: "1.0.0"

input:
  - name: credentials
    type: Credentials
    required: false
    # Presente no fluxo de autenticação (Identity Lifecycle, etapa
    # "Autenticada") — e-mail/senha nesta Release. Ausente quando o
    # input é sessionToken (resolução de uma Identity já autenticada).
  - name: sessionToken
    type: string
    required: false
    # Presente na resolução de uma Identity a partir de uma Session
    # já emitida (Identity Lifecycle, etapas 4 em diante). Ausente no
    # primeiro login, quando ainda não existe Session.
  - name: workspaceId
    type: string
    required: false
    # Seleciona o Workspace ativo (Identity Lifecycle, etapa 5). Sem
    # ele, a Identity resolvida fica sem Permissions/Autonomy — só
    # o que é estável independente de Workspace (Tenant, Companies e
    # Workspaces acessíveis, Teams).

output:
  - name: context
    type: Context
    # Objeto imutável — Identity + User + Workspace ativo + Permissions
    # efetivas + Autonomy Level efetivo, ver IDENTITY_LIFECYCLE.md e
    # ADR-0066. Trocar de Workspace nunca muta esta saída; produz uma
    # nova. Campo renomeado de "identity"/"Identity" para "context"/
    # "Context" na Release 3.5, para bater com o código real — na
    # Release 3 (antes da implementação), "Identity" era usado de
    # forma solta para "o resultado da resolução"; ADR-0064/ADR-0066
    # separaram formalmente o aggregate `Identity` do valor `Context`
    # que ele produz. Ver validação cruzada no Decision Log da 3.5.

events:
  - identity.created
  - identity.activated
  - identity.disabled
  - session.started
  - session.ended
  - workspace.selected
  - role.assigned
  - role.revoked
  - permission.granted
  - permission.revoked
# Os dez eventos publicados de fato pela Release 3B — ver EVENT_CATALOG.md
# para payload/consumidor/versão de cada um. Os três nomes "candidatos"
# que este contrato listava antes do código existir (identity.authenticated,
# identity.workspace_selected, identity.session_expired) não sobreviveram
# tal como escritos — corrigido na validação cruzada da Release 3.5.

permissions: []
# Resolver a própria Identity não exige nenhuma Permission — é o
# contrário: é o que produz o conjunto de Permissions que toda outra
# chamada de Capability vai exigir. Autenticação (login) tem sua
# própria verificação (credencial válida), não uma Permission.

autonomy_level_required: 0
# Resolver/autenticar uma Identity é leitura/autenticação, nunca uma
# ação que o SIGMA executa em nome do usuário — não compete com o
# Autonomy Level de nenhuma Mission.

supported_versions:
  - "1.0.0"

compatible_with:
  protocol: "1.0"
