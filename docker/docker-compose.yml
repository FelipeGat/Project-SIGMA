services:
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "18080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SIGMA_MANIFEST_PATH: /app/system-manifest.yaml
    depends_on:
      redis:
        condition: service_healthy

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: sigma_identity
      MARIADB_USER: sigma
      MARIADB_PASSWORD: sigma
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    ports:
      - "18081:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: sigma_identity
      DB_USER: sigma
      DB_PASSWORD: sigma
      SIGMA_MANIFEST_PATH: /app/system-manifest.yaml
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  memory-worker:
    build:
      context: ..
      dockerfile: docker/memory-worker.Dockerfile
    # Sem "ports": é um worker, nunca escuta HTTP (Release 4B, ver
    # docs/releases/0004b-memory-infrastructure.md). Reaproveita a
    # mesma MariaDB do Identity Engine — schema novo (tabelas), nao
    # banco/container novo.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: sigma_identity
      DB_USER: sigma
      DB_PASSWORD: sigma
      SIGMA_MANIFEST_PATH: /app/system-manifest.yaml
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy

# MariaDB entra no ambiente a partir da Release 3B (Identity
# Infrastructure) — primeira Release do projeto com persistencia
# (ver ADR-0053, que a excluiu deliberadamente da Release 2).
