services:
  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    restart: on-failure
    ports:
      - "18080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # A partir da Release 5.5 o gateway registra identity-engine e
      # mission-engine, e passa a depender da mesma MariaDB do auth —
      # schemas já existentes, nao banco/container novo.
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: sigma_identity
      DB_USER: sigma
      DB_PASSWORD: sigma
      SIGMA_MANIFEST_PATH: /app/system-manifest.yaml
    # /health/ready, nao /health/live: este healthcheck responde "devo
    # receber trafego?", que e exatamente o que `ready` significa
    # (ADR-0042/ADR-0094). Um Module `degraded` tira o servico do
    # trafego sem que o processo precise morrer.
    #
    # start_period folgado de proposito: as migrations do Identity e do
    # Mission Engine rodam na primeira requisicao HTTP (pendencia aberta
    # desde a Release 3B), entao a primeira resposta e mais lenta que as
    # seguintes. Sem esta folga o container seria marcado unhealthy
    # durante uma subida perfeitamente normal.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:10.11
    restart: on-failure
    environment:
      MARIADB_DATABASE: sigma_identity
      MARIADB_USER: sigma
      MARIADB_PASSWORD: sigma
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    restart: on-failure
    ports:
      - "18081:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: sigma_identity
      DB_USER: sigma
      DB_PASSWORD: sigma
      SIGMA_MANIFEST_PATH: /app/system-manifest.yaml
    # Ver o comentario do healthcheck do gateway — mesma politica.
    # services/auth passou a expor os tres endpoints de ADR-0042 na
    # Release 5.6 (ADR-0094); antes disso nao havia o que consultar aqui.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  memory-worker:
    build:
      context: ..
      dockerfile: docker/memory-worker.Dockerfile
    # `restart: on-failure` é o mais importante deste arquivo: o worker
    # depende de um loop bloqueante sobre uma conexão Redis viva, e a
    # Release 4.5 provou com evidência real que ele morre e nunca volta
    # sozinho quando o Redis pisca. Sem esta linha, o Twin Sync fica
    # fora do ar até alguém reiniciar o container na mão.
    restart: on-failure
    # Sem "ports": é um worker, nunca escuta HTTP (Release 4B, ver
    # docs/releases/0004b-memory-infrastructure.md). Reaproveita a
    # mesma MariaDB do Identity Engine — schema novo (tabelas), nao
    # banco/container novo.
    #
    # Sem "healthcheck", e a excecao explicita da ADR-0094: nao ha
    # endpoint a consultar num processo que nunca escuta HTTP. Sua
    # saude aqui e "o processo esta vivo", ja coberto pelo
    # `restart: on-failure` acima.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: sigma_identity
      DB_USER: sigma
      DB_PASSWORD: sigma
      SIGMA_MANIFEST_PATH: /app/system-manifest.yaml
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  mission-worker:
    build:
      context: ..
      dockerfile: docker/mission-worker.Dockerfile
    # O segundo worker do SIGMA (Release 6B). Assina mission.planned,
    # publicado pelo Planner Engine, e cria a Mission correspondente —
    # o primeiro consumidor real de evento do Mission Engine.
    #
    # `restart: on-failure` importa tanto quanto no memory-worker: sem
    # este processo de pe, uma Intent planejada NAO vira Mission e
    # ninguem percebe (o Planner e sem estado e quem chamou ja recebeu
    # 202). Redis pub/sub nao guarda mensagem para assinante ausente —
    # ver Risco 2 da Proposal 6B e Release 4.5.
    restart: on-failure
    # Sem "ports" e sem "healthcheck": nunca escuta HTTP — mesma
    # excecao explicita de ADR-0094 aplicada ao memory-worker.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: sigma_identity
      DB_USER: sigma
      DB_PASSWORD: sigma
      SIGMA_MANIFEST_PATH: /app/system-manifest.yaml
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy

# MariaDB entra no ambiente a partir da Release 3B (Identity
# Infrastructure) — primeira Release do projeto com persistencia
# (ver ADR-0053, que a excluiu deliberadamente da Release 2).
