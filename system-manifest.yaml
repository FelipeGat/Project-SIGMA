# System Manifest do SIGMA — lido pelo Bootstrap na etapa `discover`.
# Ver SYSTEM_MANIFEST.md.

# Versão do FORMATO deste arquivo (não do projeto SIGMA — isso é `version`,
# abaixo). O Bootstrap rejeita qualquer manifestVersion que não reconheça.
# Ver ADR-0058.
manifestVersion: 1

project: SIGMA
version: "1.0"

modules:
  - name: kernel
    kind: package
    optional: false
  - name: event-bus
    kind: service
    optional: false
    minVersion: "1.0.0"
  - name: identity-engine
    kind: engine
    # optional: true aqui não significa "este Module é dispensável" —
    # significa "nem todo processo que lê este Manifest precisa
    # registrá-lo". services/gateway só registra kernel+event-bus;
    # services/auth registra os três, incluindo identity-engine, e
    # sempre o mantém presente do próprio ponto de vista. Ver Decision
    # Log da Release 3B — gap descoberto ao validar via HTTP real.
    optional: true
    minVersion: "1.0.0"

# Providers de IA — não interpretados pelo Bootstrap ainda. Chega com o
# Agent Engine (Release 9). Vazio propositalmente aqui.
providers: []

# Workspaces: hoje modelados pelo Identity Engine (packages/identity-engine),
# não por este campo do Manifest — ver IDENTITY_MODEL.md. Vazio propositalmente aqui.
workspace: []
