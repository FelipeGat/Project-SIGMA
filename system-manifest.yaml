# System Manifest do SIGMA — lido pelo Bootstrap na etapa `discover`.
# Ver SYSTEM_MANIFEST.md.

# Versão do FORMATO deste arquivo (não do projeto SIGMA — isso é `version`,
# abaixo). O Bootstrap rejeita qualquer manifestVersion que não reconheça.
# Ver ADR-0058.
manifestVersion: 1

project: SIGMA
version: "1.0"

modules:
  - name: kernel
    kind: package
    optional: false
  - name: event-bus
    kind: service
    optional: false
    minVersion: "1.0.0"
  - name: identity-engine
    kind: engine
    # optional: true aqui não significa "este Module é dispensável" —
    # significa "nem todo processo que lê este Manifest precisa
    # registrá-lo". services/auth e, a partir da Release 5.5,
    # services/gateway registram identity-engine e sempre o mantêm
    # presente do próprio ponto de vista; services/memory-worker não.
    # Ver Decision Log da Release 3B — gap descoberto ao validar via
    # HTTP real.
    optional: true
    minVersion: "1.0.0"
  - name: memory-engine
    kind: engine
    # Mesmo raciocínio de identity-engine acima — só services/memory-worker
    # registra este Module. Ver docs/releases/0004b-memory-infrastructure.md.
    optional: true
    minVersion: "1.0.0"
  - name: mission-engine
    kind: engine
    # Registrado por services/gateway a partir da Release 5.5, que
    # expõe as duas primeiras rotas de domínio do SIGMA (POST /missions
    # e GET /missions/{id}) — até a 5C este Module não tinha nenhum
    # consumidor real (ver docs/releases/0005.5-vertical-slice.md).
    optional: true
    minVersion: "1.0.0"

  - name: planner-engine
    kind: engine
    # Registrado por services/gateway a partir da Release 6B, que expoe
    # POST /intents. Unico Engine do projeto sem banco e sem migration:
    # o Planner nao persiste nada (ADR-0095).
    optional: true
    minVersion: "1.0.0"

# Providers de IA — não interpretados pelo Bootstrap ainda. Chega com o
# Agent Engine (Release 9). Vazio propositalmente aqui.
providers: []

# Workspaces: hoje modelados pelo Identity Engine (packages/identity-engine),
# não por este campo do Manifest — ver IDENTITY_MODEL.md. Vazio propositalmente aqui.
workspace: []
