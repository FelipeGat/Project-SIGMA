# System Manifest do SIGMA — lido pelo Bootstrap na etapa `discover`.
# Ver SYSTEM_MANIFEST.md. Nesta Release (2 — SIGMA Bootstrap), apenas
# infraestrutura: nenhum Engine ou Plugin real existe ainda.

# Versão do FORMATO deste arquivo (não do projeto SIGMA — isso é `version`,
# abaixo). O Bootstrap rejeita qualquer manifestVersion que não reconheça.
# Ver ADR-0058.
manifestVersion: 1

project: SIGMA
version: "1.0"

modules:
  - name: kernel
    kind: package
    optional: false
  - name: event-bus
    kind: service
    optional: false
    minVersion: "1.0.0"

# Providers de IA e Workspaces — não interpretados pelo Bootstrap
# (Release 2). Chegam com o Agent Engine (Release 9) e o Identity
# Engine (Release 3), respectivamente. Vazios propositalmente aqui.
providers: []
workspace: []
